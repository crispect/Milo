name: Revisar las habitaciones de Milo
on:
  push:
    branches: [qa/camara-cuarto]
permissions:
  contents: read
jobs:
  habitaciones:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install playwright==1.51.0 Pillow
      - run: python scripts/playwright-smoke.py
