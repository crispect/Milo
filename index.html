<script>
// Separate from the module so even an import/syntax failure cannot hide forever.
(()=>{
 let ready=false;
 const loading=document.querySelector("#load"),message=document.querySelector("#load p"),details=document.querySelector("#loadError");
 function fail(error){
   clearTimeout(timer);loading.style.display="grid";
   const reason=String(error?.message||error||"Error desconocido");
   message.textContent=/WebGL|context/i.test(reason)?"Este navegador no pudo iniciar o mantener WebGL. Prueba recargar la página o abrirla en otro navegador con soporte 3D.":"No se pudo iniciar la casa de Milo. Puedes volver a intentarlo; tu progreso guardado se conserva.";
   const diagnostic=document.createElement("p");diagnostic.style.fontSize="12px";diagnostic.textContent=reason;
   const retry=document.createElement("button");retry.textContent="Reintentar";retry.onclick=()=>location.reload();
   details.replaceChildren(diagnostic,retry);
 }
 const timer=setTimeout(()=>fail(Error("La carga tardó demasiado. Comprueba la conexión y vuelve a intentarlo.")),25000);
 window.miloStartup={fail,ready(){ready=true;clearTimeout(timer);loading.style.display="none";details.replaceChildren()}};
 window.addEventListener("error",event=>{if(!ready)fail(event.error||event.message)});
 window.addEventListener("unhandledrejection",event=>{if(!ready)fail(event.reason)});
})();
</script>
<script type="module">

const miloRoom={left:-5.95,right:.05,back:-10.35,front:-4.35,x:-2.95,z:-7.35};
function randomSeed(){return Math.floor(Math.random()*2147483646)+1}
function newState(){
 return {version:1,born:NOW,lastSim:NOW,lastVisit:null,seed:randomSeed(),energy:74,mood:72,
 traits:{curiosidad:68,creatividad:45,sociabilidad:52,valentia:55,paciencia:49,orden:39},

}

 sala:{x:-2.8,z:0.3,label:"Sala de estar"},

 {id:"pelota_azul",type:"ball",x:-2.3,z:1.9,home:"sala"},
 {id:"cuerda",type:"rope",x:-3.25,z:1.55,home:"sala"},
 {id:"patito",type:"duck",x:-1.55,z:2.6,home:"sala"},

 if(!Array.isArray(state.props))state.props=propDefaults.map(p=>({...p}));

 {id:"ordenar",name:"Llevando juguetes",place:"caja",weight:2},
 {id:"esconder",name:"Buscando un escondite",place:"sofa",weight:2},
 {id:"descansar",name:"Descansando",place:"camaMilo",weight:2},
 {id:"jardin",name:"Explorando las plantas",place:"arbol",weight:2},
 {id:"leer",name:"Olfateando la biblioteca",place:"biblioteca",weight:1},
 {id:"estudio",name:"Curioseando el estudio",place:"estudio",weight:1},
 {id:"comedor",name:"Inspeccionando el comedor",place:"comedor",weight:1},
 {id:"coleccionar",name:"Reuniendo sus juguetes",place:"caja",weight:2},
 {id:"juguete",name:"Descubriendo un juguete",place:"estudio",weight:2},
 {id:"jugarCuarto",name:"Jugando en su cuarto",place:"milo",weight:7}

const toyDestinations={

function choose(){
 let weighted=[];

  if(rand()<.21)log("Tomó una siesta tranquila en su dormitorio.","rutina",t);
 }else{
  state.energy=Math.max(9,state.energy-(5+rand()*10));
  if(isTransport(b)&&(offline||b.propId)){
   const trip=offline?chooseToyTransport(b):{prop:state.props.find(toy=>toy.id===b.propId),destination:b.destination};
   if(trip?.prop&&trip.destination){
    const {prop,destination}=trip;
    prop.x=destination.x;prop.z=destination.z;
    state.traits.creatividad=clamp(state.traits.creatividad+.07);
    const name=prop.label||prop.id.replaceAll("_"," ");
    if(b.id==="jugarCuarto"){
     state.mood=Math.min(95,state.mood+5);
     if(offline)state.position={x:prop.x,z:prop.z};
     if(!offline||rand()<.4)log("Jugó con su "+name+" en su cuarto.","juego",t);
    }else if(rand()<.38)log("Transportó "+name+" a otro rincón de la casa.","habito",t);
   }
  }
   if(b.id==="jugar"){
   state.mood=Math.min(95,state.mood+5);
   if(rand()<.4)log("Jugó durante un buen rato con su "+state.fav+".","juego",t);
  }
  if(b.id==="investigar"){
   state.traits.curiosidad=clamp(state.traits.curiosidad+.12);
   if(rand()<.25)log("Inspeccionó con atención los aromas de la cocina.","descubrimiento",t);
  }
  if(b.id==="explorar"){
   state.traits.valentia=clamp(state.traits.valentia+.06);
   if(rand()<.22)log("Exploró el patio y volvió a sus rincones conocidos.","exploracion",t);
  }
  if(b.id==="ordenar"){
   state.progress.gather++;state.traits.orden=clamp(state.traits.orden+.2);
   if(state.progress.gather===3)creation("coleccion","Reunió sus juguetes favoritos en un rincón de la sala.",-4.1,2.4,t);
   else if(rand()<.22)log("Movió un juguete hacia su rincón favorito.","habito",t);
  }
  if(b.id==="esconder"){
   state.progress.hide++;state.traits.creatividad=clamp(state.traits.creatividad+.18);
   if(state.progress.hide===4)creation("escondite","Preparó un escondite para su pelota cerca del sofá.",-4.8,-1.5,t);

  }
  if(b.id==="jardin"){
   state.progress.garden++;state.traits.curiosidad=clamp(state.traits.curiosidad+.08);
   if(state.progress.garden===6)creation("sendero","Marcó un sendero habitual entre el árbol y la puerta.",1.1,6.5,t);
   else if(rand()<.22)log("Descubrió una zona del jardín que le gusta olfatear.","descubrimiento",t);
  }
 }
 if(state.energy<22 && b.id!=="descansar")state.mood=Math.max(25,state.mood-2);
 if(!offline && rand()<.13)log("Hoy parece especialmente contento en casa.","animo",t);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function advanceOffline(){
 const maxEvents=800, step=3*60*60*1000;
 let count=Math.min(maxEvents,Math.floor(Math.max(0,NOW-state.lastSim)/step));

 for(let i=0;i<count;i++){const b=choose();apply(b,start+(i+1)*step,true)}

}
advanceOffline();
const summary=oldVisit?state.events.filter(e=>e.t>oldVisit):[];
state.lastVisit=NOW;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb7d4cc);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.12,160);

// Seeded procedural surface detail: no external textures, efficient on mobile.

     }

 function toyMesh(p){
   const g=new THREE.Group();g.name=p.label||p.id;scene.add(g);
   const inRoom=p.home==="milo";
   const add=(geometry,material,x,y,z)=>{
    const mesh=new THREE.Mesh(geometry,material);
    mesh.position.set(x,y,z);g.add(mesh);
    return mesh;
   };
   const round=(r,material,x,y,z,sx=1,sy=1,sz=1)=>{
    const mesh=add(new THREE.SphereGeometry(r,16,10),material,x,y,z);
    mesh.scale.set(sx,sy,sz);return mesh;
   };
   g.userData.center=.11;
   if(p.type==="ball"){
    const ballRadius=inRoom?.15:.17;
    round(ballRadius,inRoom?tennisBall:p.id==="pelota_verde"?M.leaf:M.blue,0,ballRadius,0);
    const seam=add(new THREE.TorusGeometry(ballRadius*.96,.008,6,28),M.cream,0,ballRadius,0);
    seam.rotation.set(.69,.37,.8);g.userData.center=ballRadius;
   }
   if(p.type==="disc"){
    add(new THREE.CylinderGeometry(.24,.22,.072,20),inRoom?toyCoral:M.red,0,.036,0);
    add(new THREE.CylinderGeometry(.182,.18,.015,20),M.cream,0,.078,0);
    add(new THREE.CylinderGeometry(.166,.16,.016,20),inRoom?toyCoral:M.red,0,.086,0);
    g.userData.center=.06;
   }
   if(p.type==="ring"){
    const mesh=add(new THREE.TorusGeometry(.186,.055,9,24),inRoom?toyMint:M.gold,0,.058,0);
    mesh.rotation.x=Math.PI/2;g.userData.center=.06;
   }
   if(p.type==="bone"){
    const shaft=add(new THREE.CapsuleGeometry(.065,.26,4,12),M.cream,0,.09,0);
    shaft.rotation.z=Math.PI/2;
    for(const x of [-.17,.17])for(const z of [-.061,.061])round(.082,M.cream,x,.085,z,1,.92,1);
   }
   if(p.type==="rope"){
    for(const strand of [0,1]){
     const curve=new THREE.CatmullRomCurve3(Array.from({length:25},(_,i)=>{
      const x=(i/24-.5)*.52,angle=(i/24)*8*Math.PI+strand*Math.PI;
      return new THREE.Vector3(x,.068+Math.cos(angle)*.02,Math.sin(x*8)*.04+Math.sin(angle)*.021);
     }));
     add(new THREE.TubeGeometry(curve,28,.032,5,false),strand===0?M.cream:toyCoral,0,0,0);
    }
    for(const x of [-.26,.26])round(.074,toyCoral,x,.076,Math.sin(x*8)*.04,1,.92,1);
   }
   if(p.type==="plush"||p.type==="duck"){
    const duck=p.type==="duck",color=duck?M.gold:inRoom?foxFur:M.rose;
    round(.156,color,0,.144,-.025,.91,.86,1.29);
    round(.11,color,0,.228,.105,1,1,.98);
    round(.072,duck?toyCoral:M.cream,0,.188,.19,1,.63,1);
    for(const side of [-1,1]){
     round(.014,M.dark,side*.056,.244,.185);
     if(!duck){
      const ear=add(new THREE.ConeGeometry(.047,.127,10),color,side*.061,.334,.084);
      ear.rotation.z=-side*.19;
     }
    }
    if(!duck){
     round(.022,M.dark,0,.205,.248);
     const tail=round(.126,color,.084,.09,-.208,1.42,.64,.66);tail.rotation.y=.5;
     round(.066,M.cream,.209,.09,-.27,1.12,.8,.85);
    }
    g.userData.center=.15;
   }
   g.traverse(mesh=>{if(mesh.isMesh)mesh.receiveShadow=true});
   propMeshes.set(p.id,g);
 }

function fitView(preset,angle){

 const vertical=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));

 // Fit every corner and leave space for the controls along the bottom.
 for(const x of [-preset.width/2,preset.width/2])for(const z of [-preset.depth/2,preset.depth/2]){
  const along=x*sin+z*cos,right=x*cos-z*sin;

 try{
 const dt=Math.min(clock.getDelta(),.04);frame+=dt;
  if(audioOn&&audioCtx){if(audioCtx.state==="running"&&performance.now()>nextBird){birds();nextBird=performance.now()+10000+Math.random()*12000}if(performance.now()>nextBark){if(Math.random()<.35)bark();nextBark=performance.now()+16000+Math.random()*16000}if(!animate.nextMusic||performance.now()>animate.nextMusic){soundtrack();animate.nextMusic=performance.now()+3400}}
 updateLighting(performance.now());
 if(!moving&&performance.now()>nextAt)startNew();
 const beforeX=dog.position.x,beforeZ=dog.position.z;
 travelSpeed+=((moving?.65:0)-travelSpeed)*(1-Math.exp(-dt*5));
 if(moving){
  const waypoint=waypoints[0]||dogTarget;
   const dx=waypoint.x-dog.position.x,dz=waypoint.z-dog.position.z,dist=Math.hypot(dx,dz);
  if(dist<.00001){if(waypoints.length)waypoints.shift();else if(carryPhase==="pickup")pickup();else completed()}else{
   const step=Math.min(dist,dt*travelSpeed),nx=dog.position.x+dx/dist*step,nz=dog.position.z+dz/dist*step;
    if(clearAt(nx,nz)){dog.position.x=nx;dog.position.z=nz}else{moving=false;waypoints=[];nextAt=performance.now()+1200;carrying=null;carryPhase=""}
   let heading=Math.atan2(dx,dz);
   dog.rotation.y+=Math.atan2(Math.sin(heading-dog.rotation.y),Math.cos(heading-dog.rotation.y))*Math.min(1,dt*8);
  }
 }
 animateDog(dt,Math.hypot(dog.position.x-beforeX,dog.position.z-beforeZ));
 dog.position.y=.012;
 dogShadow.position.set(dog.position.x,.041,dog.position.z);dogShadow.rotation.z=dog.rotation.y;
 updateCamera(dt);
 syncProps();renderer.render(scene,camera);
 if(performance.now()-lastSave>5000){savePosition();state.lastSim=Date.now();save();lastSave=performance.now()}
 }catch(error){window.miloStartup.fail(error);console.error(error);return false}
 animationId=requestAnimationFrame(animate);
 return true;
}
if(animate()){window.miloStartup.ready();savePosition();save()}
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
 const preset=cameraViews[cameraView];
 if(preset?.width)cameraGoal.radius=fitView(preset,cameraGoal.azimuth);
 pointers.clear();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden){pointers.clear();savePosition();state.lastSim=Date.now();save()}});
window.addEventListener("pagehide",()=>{savePosition();state.lastSim=Date.now();save()});
}catch(error){
 window.miloStartup.fail(error);
 console.error(error);
}
</script></body></html>
