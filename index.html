 // Navigation uses these exact wall and furniture footprints, not visual-only collision.
 const blockers=[];
 const block=(x,z,w,d)=>blockers.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2});
 // Outer boundaries and room partitions (door gaps intentionally omitted).
 block(-11.9,-2.7,.18,15.5);block(11.8,-5.45,.17,9.6);
 block(0,-10.45,23.8,.18);
 block(-5.95,-8.525,.17,3.65);block(-5.95,-.25,.17,8.4);
 block(5.95,-8.525,.17,3.65);block(5.95,-.25,.17,8.4);
 block(8.85,-4.45,2.9,.17);
 block(-6.7,4.2,10,.17);block(6.4,4.2,10.6,.17);
 block(.72,.05,1.25,.18);block(4.55,.05,2.55,.18);
 block(.05,-2.95,.16,2.8);block(.05,3.25,.16,2);
 // Living room furniture, kitchen, bedroom, library, studio, dining.
 [[-3.8,-2.4,3.1,1.3],[-2.75,.3,1.85,1.1],[-4.7,2.56,1.2,1],
 [2.4,3.45,4.6,.9],[4.25,1.18,1.2,1],[2.4,-2.68,2.8,2],
 [4.45,-3.44,1,.8],[-8.5,-6.3,1.85,1.8],[-8.9,-9.35,4.7,.6],
 [8.8,-8.2,3.3,1.3],[8.85,-6.6,1.5,1.1],[8.35,-2.45,3.0,2.0],
 [10.5,-5.7,1.1,1.1],[-3.2,6.5,2,.8]].forEach(a=>block(...a));
 const DOG_RADIUS=.31,GRID=.48;
 function clearAt(x,z){
   if(x< -11.45||x>11.35||z< -10.1||z>15.4)return false;
   for(const b of blockers)if(x>b.x1-DOG_RADIUS&&x<b.x2+DOG_RADIUS&&z>b.z1-DOG_RADIUS&&z<b.z2+DOG_RADIUS)return false;
   return true;
 }
 // A* navigation on a stable grid. No furniture/wall clipping, including between rooms.
 const gx=x=>Math.round((x+11.4)/GRID),gz=z=>Math.round((z+10)/GRID);
 const wx=i=>i*GRID-11.4,wz=j=>j*GRID-10;
 const nearest=(x,z)=>{let a={x:wx(gx(x)),z:wz(gz(z))};if(clearAt(a.x,a.z))return a;
   for(let k=1;k<24;k++)for(let dx=-k;dx<=k;dx++)for(let dz=-k;dz<=k;dz++){let xx=wx(gx(x)+dx),zz=wz(gz(z)+dz);if(clearAt(xx,zz))return {x:xx,z:zz}}return {x:0,z:1};};
 function route(from,to){
   const a=nearest(from.x,from.z),b=nearest(to.x,to.z);
   const sx=gx(a.x),sz=gz(a.z),tx=gx(b.x),tz=gz(b.z);
   const key=(x,z)=>x+":"+z,origin=key(sx,sz),goal=key(tx,tz);
   const open=[{x:sx,z:sz,g:0,f:Math.abs(sx-tx)+Math.abs(sz-tz)}],best=new Map([[origin,0]]),parent=new Map(),closed=new Set();
   for(let n=0;open.length&&n<5500;n++){
     let m=0;for(let i=1;i<open.length;i++)if(open[i].f<open[m].f)m=i;
     const v=open.splice(m,1)[0],id=key(v.x,v.z);if(closed.has(id))continue;
     if(id===goal){const path=[];let p=id;while(p!==origin){const [x,z]=p.split(":").map(Number);path.push({x:wx(x),z:wz(z)});p=parent.get(p);if(!p)break}return path.reverse()}
     closed.add(id);
     for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
       const x=v.x+dx,z=v.z+dz,k=key(x,z),g=v.g+1;
       if(closed.has(k)||!clearAt(wx(x),wz(z))||g>=(best.get(k)??Infinity))continue;
       best.set(k,g);parent.set(k,id);open.push({x,z,g,f:g+Math.abs(x-tx)+Math.abs(z-tz)});
     }
   }
   return [];
 }

 const dog=new THREE.Group();scene.add(dog);
const fur=mat(0xc98c57),lightFur=mat(0xffd5a1),inner=mat(0xe89782),nose=mat(0x332a29),eye=mat(0x1e221c);
sphere(.68,fur,0,.73,-.15,.92,.68,1.32,dog);
sphere(.44,lightFur,0,.52,.36,1,.68,1.02,dog);
sphere(.47,fur,0,1.04,.68,1.05,1,1.02,dog);
sphere(.31,lightFur,0,.82,1.03,1.08,.65,.85,dog);
sphere(.095,nose,0,.88,1.29,1,.7,.85,dog);
for(const side of [-1,1]){
 const ear=new THREE.Mesh(new THREE.ConeGeometry(.22,.56,4),fur);
 ear.position.set(side*.32,1.56,.52);ear.rotation.z=-side*.16;ear.rotation.y=Math.PI/4;ear.castShadow=true;dog.add(ear);
 sphere(.075,eye,side*.22,1.16,1.04,1,1,1,dog);
 sphere(.027,M.white,side*.205,1.195,1.10,1,1,1,dog);
}
const legs=[];
for(const side of [-1,1])for(const back of [-1,1]){
 const pivot=new THREE.Group();pivot.position.set(side*.4,.51,back*.51);dog.add(pivot);
 sphere(.19,fur,0,-.18,.03,1,.95,1,pivot);
 sphere(.18,lightFur,0,-.35,.12,1,.6,1.2,pivot);
 legs.push({pivot,side,back});
}
const tail=new THREE.Group();tail.position.set(0,.93,-.88);dog.add(tail);sphere(.24,fur,0,.06,-.18,.58,.58,1.3,tail);
const creatureMeshes=[];
function drawCreation(c){
 const g=new THREE.Group();g.position.set(c.x,0,c.z);scene.add(g);
 const mk=(geometry,material,x,y,z)=>{const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;g.add(m);return m};
 if(c.kind==="coleccion"){
  for(let i=0;i<5;i++)mk(new THREE.SphereGeometry(.12+i*.012,12,8),[M.red,M.gold,M.blue,M.rose,fur][i],Math.cos(i*1.25)*.42,.12,Math.sin(i*1.25)*.3);
 }else if(c.kind==="escondite"){
  mk(new THREE.BoxGeometry(.76,.12,.76),M.wood,0,.08,0);
  for(const x of [-.31,.31])mk(new THREE.BoxGeometry(.12,.46,.72),M.wood,x,.27,0);
  mk(new THREE.SphereGeometry(.15,12,9),M.red,0,.2,0);
 }else if(c.kind==="nido"){
  mk(new THREE.CylinderGeometry(.73,.73,.12,24),M.rose,0,.09,0);
  for(let i=0;i<3;i++)mk(new THREE.SphereGeometry(.22,12,8),M.cream,Math.cos(i*2.1)*.3,.24,Math.sin(i*2.1)*.25);
 }else if(c.kind==="sendero"){
  for(let i=0;i<7;i++)mk(new THREE.CylinderGeometry(.2,.23,.045,8),M.floor,Math.sin(i*.4)*.3,.04,(i-3)*.5);
 }
 creatureMeshes.push(g);
}
state.creations.forEach(drawCreation);
function date(t){return new Date(t).toLocaleString("es-CL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function days(){return Math.floor((Date.now()-state.born)/(24*60*60*1000))+1}
function updateLabel(b){
 $("#where").textContent=spots[b.place].label;
 $("#day").textContent="Día "+days();
 $("#thought").textContent="🐾 "+b.name;
}
function renderJournal(){
 const all=state.events.slice().sort((a,b)=>b.t-a.t);
 let h="<p>La historia de Milo continúa aunque no estés mirando. Los cambios quedan guardados en este navegador.</p>";
 if(oldVisit){h+="<h3>Desde tu última visita · "+summary.length+" acontecimientos</h3>";
 h+=summary.length?summary.slice().reverse().slice(0,22).map(e=>"<div class='event'><small>"+date(e.t)+"</small>"+e.message+"</div>").join(""):"<p>No hubo acontecimientos nuevos registrados. Puedes observarlo explorar en tiempo real.</p>";
 }else{h+="<h3>¡Bienvenido a su primer día!</h3><p>Milo acaba de llegar. En sus próximas visitas encontrarás aquí lo que haya vivido.</p>"}
 h+="<h3>Historia completa</h3>";
 h+=all.length?all.slice(0,80).map(e=>"<div class='event'><small>"+date(e.t)+" · "+e.kind+"</small>"+e.message+"</div>").join(""):"<p>Todavía no tiene recuerdos importantes. Dale tiempo para descubrir la casa.</p>";
 $("#panelContent").innerHTML=h;
}
function renderPersonality(){
 let h="<p>Sus tendencias cambian lentamente según lo que hace. Milo nunca recibe órdenes del visitante.</p>";
 for(const [k,v] of Object.entries(state.traits)){
  h+="<div class='stat'><div style='flex:1'>"+k[0].toUpperCase()+k.slice(1)+"<div class='track'><div class='fill' style='width:"+v+"%'></div></div></div><b>"+Math.round(v)+"</b></div>";
 }
 h+="<h3>Estado actual</h3><p>Energía: "+Math.round(state.energy)+" / 100 · Ánimo: "+Math.round(state.mood)+" / 100</p>";
 h+="<h3>Objetos que ha creado o reorganizado</h3>";
 h+=state.creations.length?state.creations.map(c=>"<div class='event'><small>"+date(c.t)+"</small>"+c.title+"</div>").join(""):"<p>Por ahora conserva la casa como la encontró.</p>";
 h+="<h3>Recuerdos</h3><p>Juguete preferido: "+state.fav+". Sus rutinas se construyen a partir de sus experiencias acumuladas.</p>";
 $("#panelContent").innerHTML=h;
}
function showPanel(mode){
 $("#panelTitle").textContent=mode==="journal"?"Diario de Milo":"Su personalidad";
 mode==="journal"?renderJournal():renderPersonality();
 $("#panel").classList.add("open");
}
$("#journal").onclick=()=>showPanel("journal");
$("#personality").onclick=()=>showPanel("personality");
$("#panelClose").onclick=()=>$("#panel").classList.remove("open");
let following=true,azimuth=.58,elevation=.69,radius=23;
const focus=new THREE.Vector3(-.3,0,0),clock=new THREE.Clock();
$("#follow").onclick=()=>{following=!following;$("#follow").textContent=following?"✦ Seguir a Milo":"◌ Vista libre";if(following)$("#panel").classList.remove("open")};
const canvas=renderer.domElement;
const pointers=new Map();let pinchDist=0,oldMid=null;
canvas.addEventListener("pointerdown",e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){azimuth-=(e.clientX-old.x)*.004;elevation=Math.max(.16,Math.min(1.38,elevation+(e.clientY-old.y)*.003))}
 else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};if(pinchDist)radius=Math.max(3.5,Math.min(48,radius*pinchDist/d));if(oldMid){const dx=(mid.x-oldMid.x)*radius*.0015,dz=(mid.y-oldMid.y)*radius*.0015;focus.x-=dx*Math.cos(azimuth)+dz*Math.sin(azimuth);focus.z+=dx*Math.sin(azimuth)-dz*Math.cos(azimuth);following=false;$("#follow").textContent="◌ Vista libre"}pinchDist=d;oldMid=mid}
});
const end=e=>{pointers.delete(e.pointerId);pinchDist=0;oldMid=null};
canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);
canvas.addEventListener("dblclick",()=>{following=true;$("#follow").textContent="✦ Seguir a Milo"});
 canvas.addEventListener("wheel",e=>{e.preventDefault();radius=Math.max(3.5,Math.min(48,radius+Math.sign(e.deltaY)*.85))},{passive:false});
let current=choose(),nextAt=performance.now(),lastSave=performance.now(),moving=true;
let dogTarget=spots[current.place],waypoints=[];
 function plan(){waypoints=route(dog.position,dogTarget);if(waypoints.length===0){dogTarget=nearest(dog.position.x,dog.position.z)}}
updateLabel(current);
function startNew(){
 current=choose();dogTarget=spots[current.place];moving=true;plan();updateLabel(current);
}
function completed(){
 apply(current,Date.now(),false);
 state.lastSim=Date.now();
 for(const c of state.creations){if(!c.drawn){c.drawn=true;drawCreation(c)}}
 save();
 moving=false;nextAt=performance.now()+(4000+rand()*5000);
}
if(state.position)dog.position.set(state.position.x,.05,state.position.z);
 if(!clearAt(dog.position.x,dog.position.z)){const safe=nearest(dog.position.x,dog.position.z);dog.position.set(safe.x,.05,safe.z)}
 plan();
$("#load").remove();
let frame=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);frame+=dt;
 const hour=new Date().getHours();const night=hour<7||hour>19;
 sun.intensity=night?1.2:2.5;ambient.intensity=night?1.4:2.4;
 if(!moving&&performance.now()>nextAt)startNew();
 let speed=0;
 if(moving){
  const waypoint=waypoints[0]||dogTarget;
   const dx=waypoint.x-dog.position.x,dz=waypoint.z-dog.position.z,dist=Math.hypot(dx,dz);
  if(dist<.13){if(waypoints.length)waypoints.shift();else completed()}else{
   speed=Math.min(1,dist*2);
   const step=Math.min(dist,dt*1.35),nx=dog.position.x+dx/dist*step,nz=dog.position.z+dz/dist*step;
    if(clearAt(nx,nz)){dog.position.x=nx;dog.position.z=nz}else{plan();if(!waypoints.length){moving=false;nextAt=performance.now()+1200}}
   let heading=Math.atan2(dx,dz);
   dog.rotation.y+=Math.atan2(Math.sin(heading-dog.rotation.y),Math.cos(heading-dog.rotation.y))*Math.min(1,dt*8);
  }
 }
 for(let i=0;i<legs.length;i++)legs[i].pivot.rotation.x=Math.sin(frame*11+(i%2)*Math.PI+(i<2?0:Math.PI))*.45*speed;
 tail.rotation.y=Math.sin(frame*10)*.5;
 dog.position.y=.06+Math.abs(Math.sin(frame*11))*.04*speed;
 if(following){focus.x+=(dog.position.x-focus.x)*dt*1.8;focus.z+=(dog.position.z-focus.z)*dt*1.8}
 const length=radius;camera.position.set(focus.x+Math.sin(azimuth)*Math.cos(elevation)*length,Math.sin(elevation)*length+1.2,focus.z+Math.cos(azimuth)*Math.cos(elevation)*length);
 camera.lookAt(focus.x,0,focus.z);
 renderer.render(scene,camera);
 if(performance.now()-lastSave>5000){state.lastSim=Date.now();save();lastSave=performance.now()}
}
animate();
window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.addEventListener("visibilitychange",()=>{if(document.hidden){state.lastSim=Date.now();save()}});
window.addEventListener("pagehide",()=>{state.lastSim=Date.now();save()});
}catch(error){
 document.querySelector("#loadError").innerHTML="<p>No fue posible iniciar el motor 3D. Abre esta página en Safari, con conexión a internet, y vuelve a cargar.</p><p style='font-size:11px'>"+String(error.message||error)+"</p><button onclick='location.reload()'>Reintentar</button>";
 console.error(error);
}
